services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdlog
    ports:
      - "5432:5432"
    volumes:
      - crowdlog-postgres-data:/var/lib/postgresql/data

volumes:
  crowdlog-postgres-data:
